name: Release

# A version tag publishes what an execution host installs, each with its
# SHA-256: the plugin, and the upstream `lithos-sandbox` CLI built at the same
# sandbox-driver revision the plugin pins, so a host can drive the plugin over
# protocol v2 with nothing built on it. Both are built on Ubuntu 24.04, so the
# host needs glibc 2.39 or newer. Pull requests build the same assets without
# publishing them, so this workflow is exercised before a tag depends on it.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  SANDBOX_DRIVER_REV: 90b0d825767105d4b42e59fdbd116c4d66b87d83

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: >-
          cargo install --locked --root cli
          --git https://github.com/lithoscomputer/sandbox-driver
          --rev "$SANDBOX_DRIVER_REV" sandbox-driver-cli
      - name: Package the binaries and their checksums
        run: |
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="pr-${GITHUB_SHA::12}" ;; esac
          target=x86_64-unknown-linux-gnu
          mkdir dist
          install -m 0755 target/release/sandbox-driver-kubernetes "dist/sandbox-driver-kubernetes-${version}-${target}"
          install -m 0755 cli/bin/lithos-sandbox "dist/lithos-sandbox-${SANDBOX_DRIVER_REV::12}-${target}"
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256)
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
