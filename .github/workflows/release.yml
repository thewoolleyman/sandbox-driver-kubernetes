name: Release

# A version tag publishes the plugin binary that execution hosts pin by
# checksum. The binary is built on Ubuntu 24.04, so it needs glibc 2.39 or
# newer on the host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package the binary and its checksum
        run: |
          asset="sandbox-driver-kubernetes-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          install -m 0755 target/release/sandbox-driver-kubernetes "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "$GITHUB_REF_NAME" --generate-notes
